# Fields
#   action      explain | example | where-used | ask
#   doc/anchor  where the reader is; the selection must appear in that section
#   selection   the selected text ("" when only a question is typed)
#   question    the typed question (ask)
#   concept     the term to look up, when it differs from the selection
#   memory      readUpTo: N (reading-path docs 1..N are done), read: [paths],
#               known: [terms] (got it), unclear: [terms], language: match | en | zh
#   proposed    docs a text search suggests; refresh with `npm run evals:propose`
#   expected    docs a good answer cites, checked by hand; recall is scored against this
#               TODO(human): the expected lists are a provisional first pass (proposed docs minus index
#               pages and news, capped at 6/3/2 per action). Review each: keep what a good answer must cite.
#   mustNotMention  phrases that would mean a tangent

